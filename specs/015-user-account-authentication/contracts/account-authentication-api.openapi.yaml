openapi: 3.1.0
info:
  title: TechStore Account and Authentication API
  version: 1.0.0
  description: >
    External routes are accessed through the API Gateway. Internal session
    introspection is private to backend services and is not routed by the Gateway.
    Logout is client-side for this stateless access-token flow; no server logout
    endpoint is added and clearing local state does not revoke a copied token.
servers:
  - url: http://localhost:8080/api
    description: Public API Gateway
tags:
  - name: Authentication
  - name: Account
  - name: Internal Session Validation
paths:
  /auth/register:
    post:
      operationId: registerUser
      summary: Create an unverified public user account
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created; email delivery status is not represented as guaranteed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountCreatedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email already registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/login:
    post:
      operationId: login
      summary: Authenticate an active, email-verified account
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Existing HS256 bearer JWT contract with auth_version claim.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Generic response for invalid credentials, inactive, or unverified account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/verify-email:
    post:
      operationId: verifyEmail
      summary: Verify an email address using a single-use link token
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '204':
          description: Email verified.
        '400':
          description: Token invalid, expired, used, or superseded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/resend-verification:
    post:
      operationId: resendVerification
      summary: Request email verification instructions without account enumeration
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          description: Generic acknowledgement independent of account existence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericAcknowledgement'
  /auth/forgot-password:
    post:
      operationId: requestPasswordReset
      summary: Request password reset instructions without account enumeration
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          description: Generic acknowledgement independent of account existence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericAcknowledgement'
  /auth/reset-password:
    post:
      operationId: resetPassword
      summary: Reset a password with a single-use token and revoke prior sessions
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: Password updated and all earlier user sessions revoked.
        '400':
          description: Token invalid, expired, used, or password invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /users/me:
    get:
      operationId: getMyProfile
      summary: Read the authenticated user's profile
      tags: [Account]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user's public account profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      operationId: updateMyProfile
      summary: Update allowed basic profile fields
      tags: [Account]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Updated public profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/me/password:
    put:
      operationId: changeMyPassword
      summary: Change password after verifying the current password
      tags: [Account]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password changed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /internal/auth/introspect:
    post:
      operationId: introspectSession
      summary: Validate a signed access token and its current user auth version
      description: >
        Private backend-only contract. Do not route through the public API
        Gateway. Return only active status; validate token signature, issuer
        contract, expiration, subject and auth_version against User Service data.
      tags: [Internal Session Validation]
      servers:
        - url: http://user-service:8082
          description: Private service network
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Token is currently active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntrospectionResponse'
        '401':
          description: Missing, malformed, expired, or revoked token.
        '503':
          description: Session authority cannot determine current validity.
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Required by the new registration UI; optional only for backward compatibility with existing API clients.
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 72
    AccountCreatedResponse:
      type: object
      required: [id, email, role, active, createdAt, updatedAt, emailVerified]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: [string, 'null']
          maxLength: 100
        email:
          type: string
          format: email
        emailVerified:
          type: boolean
          const: false
        role:
          type: string
          enum: [USER, ADMIN]
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          minimum: 1
    TokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
    EmailRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, newPassword]
      properties:
        token:
          type: string
          minLength: 1
        newPassword:
          type: string
          minLength: 8
          maxLength: 72
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
        newPassword:
          type: string
          minLength: 8
          maxLength: 72
    ProfileResponse:
      type: object
      required: [id, email, emailVerified]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: [string, 'null']
          maxLength: 100
        email:
          type: string
          format: email
        emailVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time
    GenericAcknowledgement:
      type: object
      required: [message]
      properties:
        message:
          type: string
    IntrospectionResponse:
      type: object
      required: [active]
      additionalProperties: false
      properties:
        active:
          type: boolean
    ErrorResponse:
      type: object
      required: [status, message, timestamp]
      properties:
        status:
          type: integer
        message:
          type: string
        details:
          type: string
        correlationId:
          type: string
        timestamp:
          type: string
          format: date-time
