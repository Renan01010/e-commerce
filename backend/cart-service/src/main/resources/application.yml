server:
  port: ${PORT:${SERVER_PORT:8083}}

spring:
  application:
    name: cart-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/techstore_cart_db}
    username: ${SPRING_DATASOURCE_USERNAME:techstore}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  flyway:
    enabled: true
    locations: classpath:db/migration

techstore:
  jwt:
    secret: ${TECHSTORE_JWT_SECRET}
  product-service:
    url: ${PRODUCT_SERVICE_URL:http://localhost:8081}
    connect-timeout: ${PRODUCT_SERVICE_CONNECT_TIMEOUT:1s}
    read-timeout: ${PRODUCT_SERVICE_READ_TIMEOUT:2s}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [correlationId:%X{correlationId:-}]"