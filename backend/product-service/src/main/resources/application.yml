server:
  port: ${PORT:${SERVER_PORT:8080}}

spring:
  application:
    name: product-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/techstore_product_db}
    username: ${SPRING_DATASOURCE_USERNAME:techstore}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    placeholders:
      categorySlugOverrides: ${CATEGORY_SLUG_OVERRIDES_JSON:}

techstore:
  jwt:
    secret: ${TECHSTORE_JWT_SECRET:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [correlationId:%X{correlationId:-}]"