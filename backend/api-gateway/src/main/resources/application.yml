server:
  port: ${PORT:${SERVER_PORT:8080}}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: product-service
          uri: ${PRODUCT_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/products/**,/api/categories/**
        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/auth/**,/api/users/**
          filters:
            - StripPrefix=1
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
            allowedMethods: GET,POST,PUT,DELETE,OPTIONS
            allowedHeaders: Authorization,Content-Type,X-Correlation-ID
            exposedHeaders: X-Correlation-ID
            allowCredentials: false

management:
  endpoint:
    gateway:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,metrics,gateway

logging:
  pattern:
    level: "%5p [correlationId:%X{correlationId:-}]"