services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-techstore_product_db}
      POSTGRES_USER: ${POSTGRES_USER:-techstore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - product_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  user-database-init:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-techstore_product_db}
      POSTGRES_USER: ${POSTGRES_USER:-techstore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in .env}
      USER_POSTGRES_DB: ${USER_POSTGRES_DB:-techstore_user_db}
    volumes:
      - ./docker/postgres/init-user-database.sh:/usr/local/bin/init-user-database.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/init-user-database.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  product-service:
    build:
      context: .
      dockerfile: backend/product-service/Dockerfile
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-techstore_product_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-techstore}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in .env}
      TECHSTORE_JWT_SECRET: ${TECHSTORE_JWT_SECRET:?Configure TECHSTORE_JWT_SECRET in .env}
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"

  user-service:
    build:
      context: .
      dockerfile: backend/user-service/Dockerfile
    environment:
      SERVER_PORT: ${USER_SERVICE_PORT:-8082}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${USER_POSTGRES_DB:-techstore_user_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-techstore}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in .env}
      TECHSTORE_JWT_SECRET: ${TECHSTORE_JWT_SECRET:?Configure TECHSTORE_JWT_SECRET in .env}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    depends_on:
      user-database-init:
        condition: service_completed_successfully
    ports:
      - "${USER_SERVICE_PORT:-8082}:${USER_SERVICE_PORT:-8082}"

  api-gateway:
    build:
      context: .
      dockerfile: backend/api-gateway/Dockerfile
    environment:
      SERVER_PORT: 8080
      PRODUCT_SERVICE_URL: http://product-service:8081
      TECHSTORE_JWT_SECRET: ${TECHSTORE_JWT_SECRET:?Configure TECHSTORE_JWT_SECRET in .env}
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    depends_on:
      - product-service
    ports:
      - "8080:8080"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api}
    depends_on:
      - api-gateway
    ports:
      - "5173:8080"

volumes:
  product_data: